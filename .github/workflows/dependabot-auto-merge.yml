name: Dependabot Auto Merge
# pull_request, not pull_request_target: GitHub's default event policy blocks
# pull_request_target in public repos from 2026-12-02, and Dependabot's token is
# read-only by default but elevatable through the permissions: key. No pull
# request code is checked out here.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge for Dependabot
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
