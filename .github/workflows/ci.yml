name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  read-all
env:
  GO_VERSION: '1.26.1'
  BINARY_NAME: mcp-ripestat
jobs:
  check-commit:
    name: Check Commit Type
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-chore: ${{ steps.check.outputs.is-chore }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check if commit is chore
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          echo "Commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" =~ ^chore(\(.*\))?!?:.* ]]; then
            echo "is-chore=true" >> "$GITHUB_OUTPUT"
            echo "🔧 Detected chore commit - will skip build/test/release"
          else
            echo "is-chore=false" >> "$GITHUB_OUTPUT"
            echo "✅ Regular commit - will run full pipeline"
          fi
  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: [check-commit]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Super-Linter
        uses: super-linter/super-linter@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITATTRIBUTES: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
          skip-cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1
        with:
          repo-checkout: false
          go-version-input: ${{ env.GO_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@820e3160e279568db735cee8ed8f8e77a6da7818 # v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@820e3160e279568db735cee8ed8f8e77a6da7818 # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@820e3160e279568db735cee8ed8f8e77a6da7818 # v3
        with:
          category: /language:go
  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: [check-commit, lint]
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-commit.outputs.is-chore == 'true') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: make test
      - name: Check coverage threshold
        run: make check-coverage
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-commit, test]
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-commit.outputs.is-chore == 'true') }}
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build-cross
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BINARY_NAME }}-*
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check-commit, build]
    if: needs.check-commit.outputs.is-chore != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.semantic.outputs.new_release_version }}
          tags: |
            ghcr.io/taihen/${{ env.BINARY_NAME }}:latest
            ghcr.io/taihen/${{ env.BINARY_NAME }}:${{ steps.semantic.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update release with Docker info
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          RELEASE_TAG="v${{ steps.semantic.outputs.new_release_version }}"
          RELEASE_BODY=$(gh release view "$RELEASE_TAG" --json body --jq '.body')
          NEW_BODY="${RELEASE_BODY}

          ## Docker Images
          Pull the Docker image:
          \`\`\`bash
          docker pull ghcr.io/taihen/${{ env.BINARY_NAME }}:${{ steps.semantic.outputs.new_release_version }}
          docker pull ghcr.io/taihen/${{ env.BINARY_NAME }}:latest
          \`\`\`"
          gh release edit "$RELEASE_TAG" --notes "$NEW_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
